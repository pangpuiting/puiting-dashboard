name: daily-update

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 北京时间 09:00
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch official data
        run: python scripts/fetch_data.py --out data.json

      - name: Update dashboard HTML
        run: python scripts/update_html.py --html index.html --data data.json

      - name: Smoke test
        run: python scripts/smoke_test.py --html index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: official update $(date -u +'%Y-%m-%d')"
            git push
          fi
